<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 148">
  <defs>
    <!-- Lower half of intersection: left diamond renders on top here -->
    <clipPath id="cl">
      <polygon points="87,74 117.5,104.5 148,74"/>
    </clipPath>
  </defs>

  <!-- Left diamond (back layer) -->
  <g transform="translate(74,74) rotate(45)">
    <rect x="-52.3" y="-52.3" width="104.6" height="104.6" rx="12" fill="#062F71"/>
    <rect x="-45.3" y="-45.3" width="90.6"  height="90.6"  rx="10" fill="#ffffff"/>
    <rect x="-19.8" y="-19.8" width="39.6"  height="39.6"  rx="5"  fill="#062F71"/>
  </g>

  <!-- Right diamond (on top of left) -->
  <g transform="translate(161,74) rotate(45)">
    <rect x="-52.3" y="-52.3" width="104.6" height="104.6" rx="12" fill="#062F71"/>
    <rect x="-45.3" y="-45.3" width="90.6"  height="90.6"  rx="10" fill="#ffffff"/>
    <rect x="-19.8" y="-19.8" width="39.6"  height="39.6"  rx="5"  fill="#062F71"/>
  </g>

  <!-- Left diamond clipped to lower intersection (front in that region) -->
  <g clip-path="url(#cl)">
    <g transform="translate(74,74) rotate(45)">
      <rect x="-52.3" y="-52.3" width="104.6" height="104.6" rx="12" fill="#062F71"/>
      <rect x="-45.3" y="-45.3" width="90.6"  height="90.6"  rx="10" fill="#ffffff"/>
      <rect x="-19.8" y="-19.8" width="39.6"  height="39.6"  rx="5"  fill="#062F71"/>
    </g>
  </g>
</svg>

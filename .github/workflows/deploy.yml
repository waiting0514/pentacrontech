name: Deploy to Linode

on:
  workflow_dispatch:

# 同一時間只允許一個部署在跑
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 伺服器上的部署資料夾（換專案或改位置時修改這裡，並同步修改 deploy/ 底下的檔案）
env:
  APP_DIR: /var/www/pentacrontech.com

jobs:
  # ===========================================================================
  # 測試：通過後才會部署
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password
      APP_LOCALE: zh-TW

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, mysql, gd, zip, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # 前台頁面測試需要 Vite manifest
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  # ===========================================================================
  # 部署
  # ===========================================================================
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v5

      # -------------------------------------------------------------------------
      # 2. 安裝 PHP（在 Runner 上 build）
      # -------------------------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, mysql, gd, zip, intl, opcache
          coverage: none

      # -------------------------------------------------------------------------
      # 3. 安裝 Composer 相依套件（僅正式環境，排除 dev）
      # -------------------------------------------------------------------------
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # -------------------------------------------------------------------------
      # 4. 安裝 Node.js 並 build 前端
      # -------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies & build
        run: |
          npm ci
          npm run build

      # -------------------------------------------------------------------------
      # 5. 設定 SSH
      # -------------------------------------------------------------------------
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LINODE_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.LINODE_PORT }} -H ${{ secrets.LINODE_HOST }} >> ~/.ssh/known_hosts

      # -------------------------------------------------------------------------
      # 6. 修正 storage 權限（www-data 建立的檔案 deployer 無法覆寫，會讓 rsync 失敗）
      #    需要 project-init.sh 設定的 sudoers 權限
      # -------------------------------------------------------------------------
      - name: Fix storage permissions
        run: |
          ssh -p ${{ secrets.LINODE_PORT }} ${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }} \
            "sudo -n /usr/bin/chown -R deployer:www-data ${{ env.APP_DIR }}/storage && sudo -n /usr/bin/chmod -R 775 ${{ env.APP_DIR }}/storage"

      # -------------------------------------------------------------------------
      # 7. 上傳檔案到伺服器（排除不需要的目錄）
      # -------------------------------------------------------------------------
      - name: Sync files to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='public/storage' \
            --exclude='storage/app' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='deploy' \
            --exclude='*.sh' \
            -e "ssh -p ${{ secrets.LINODE_PORT }}" \
            ./ ${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }}:${{ env.APP_DIR }}/

      # -------------------------------------------------------------------------
      # 8. 執行部署後指令
      # -------------------------------------------------------------------------
      - name: Run post-deploy commands
        run: |
          ssh -p ${{ secrets.LINODE_PORT }} ${{ secrets.LINODE_USER }}@${{ secrets.LINODE_HOST }} << 'EOF'
            set -e
            cd ${{ env.APP_DIR }}

            # 執行 migration
            php artisan migrate --force

            # 建立或修正 storage symbolic link（--force 會覆蓋指向錯誤路徑的舊連結）
            php artisan storage:link --force || true

            # 清除並重新建立快取
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # 重啟 PHP-FPM
            sudo systemctl reload php8.4-fpm

            echo "✅ 部署完成"
          EOF

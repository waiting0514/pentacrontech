server {
    listen 80;
    listen [::]:80;

    # 替換成你的 domain 或 IP
    server_name pentacrontech.com www.pentacrontech.com;

    root /var/www/pentacrontech.com/public;
    index index.php;

    # 上傳檔案大小限制（配合圖片上傳功能）
    client_max_body_size 20M;

    # 靜態資源快取
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Laravel 路由處理
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # 禁止存取隱藏檔案（.env, .git 等）
    location ~ /\. {
        deny all;
    }

    # 日誌
    access_log /var/log/nginx/pentacrontech.com-access.log;
    error_log  /var/log/nginx/pentacrontech.com-error.log;
}